backend:
  name: github
  repo: poslock/kantor-camat-mandonga
  branch: main
  # base_url: <URL Worker Cloudflare Anda> # Akan diisi di Langkah Ketiga

media_folder: "images" # Folder penyimpanan gambar yang diunggah
public_folder: "/images"

collections:
  - name: "berita"
    label: "Berita"
    folder: "content/berita" # File konten akan disimpan di folder ini
    create: true
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Ringkasan", name: "summary", widget: "text" }
