
backend:
  name: github
  repo: poslock/kantor-camat-mandonga
  branch: main
  base_url: https://sveltia-cms-auth.adityasubata3-ca5.workers.dev

media_folder: "images/uploads"
public_folder: "https://raw.githubusercontent.com/poslock/kantor-camat-mandonga/main/images/uploads"

collections:
  - name: "berita"
    label: "Berita & Pengumuman"
    folder: "content/berita"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul Berita", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - "Kegiatan"
          - "Pengumuman"
          - "Sosial"
      - label: "Gambar Utama"
        name: "image"
        widget: "image"
        required: false
      - { label: "Ringkasan", name: "summary", widget: "text" }
      - { label: "Isi Berita", name: "body", widget: "markdown" }
